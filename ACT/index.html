                      รีวิวเจาะลึกแบบวันต่อวัน ว่าต้องเจอสภาพอากาศแบบไหน ร่างกายจะรู้สึกยังไง และไฮไลต์แต่ละวันที่ทำให้ทริปนี้โคตรคุ้มค่า!
                    </p>
                  </div>

                  <div className="space-y-8">
                    {itinerary.map((day, idx) => (
                      <div key={idx} className="bg-white rounded-[2rem] shadow-sm border border-slate-100 overflow-hidden hover:shadow-lg transition-all border-l-8 border-l-blue-600">

                          <div className="w-full md:w-1/3 shrink-0">
                             {day.img ? (
                               <div className="h-64 rounded-2xl overflow-hidden mb-4 shadow-inner">
                                 <img src={day.img} className="w-full h-full object-cover" />
                               </div>
                             ) : (
                               <div className="h-32 bg-slate-50 rounded-2xl flex flex-col items-center justify-center border-2 border-dashed border-slate-200 mb-4">
                                 <i className="fa-solid fa-mountain text-[2rem] text-slate-200"></i>
                                 <span className="text-[10px] font-black text-slate-300 uppercase mt-2">Himalayan Wilderness</span>
                               </div>

                               <div className="flex items-center justify-between text-xs font-black uppercase text-slate-400 border-b pb-2">

                               </div>
                               <div className="flex items-center justify-between text-xs font-black uppercase text-blue-600">

                                   <i className="fa-solid fa-sun text-sm"></i>
                                   <span>Wake Up</span>
                                 </div>
                                 <span>{day.wakeUp || "---"}</span>
                               </div>
                               <div className="flex items-center justify-between text-xs font-black uppercase text-indigo-500 pt-2 border-t border-slate-100">
                                 <div className="flex items-center gap-2">
                                   <i className="fa-solid fa-moon text-sm"></i>
                                   <span>Bed Time</span>
                                 </div>
                                 <span>{day.bedTime || "---"}</span>
                               </div>
                             </div>
                          </div>
                          
                          <div className="flex-1 flex flex-col">
                            <div className="flex items-center gap-3 mb-4">
                              <span className="bg-slate-900 text-white px-3 py-1 rounded-lg text-xs font-black">DAY {idx+1}</span>
                              <h4 className="text-2xl font-black uppercase tracking-tight text-slate-900">{day.plan}</h4>
                            </div>
                            
                            <div className="relative">
                              <i className="fa-solid fa-quote-left absolute -left-4 -top-4 text-[2rem] text-blue-50 opacity-50"></i>
                              <p className="text-slate-600 font-medium leading-relaxed text-base mb-6 relative z-10">
                                {day.review}
                              </p>
                            </div>

                            <div className="bg-slate-50 rounded-2xl p-6 border border-slate-100 mt-auto">
                              <div className="flex items-center gap-2 mb-2">
                                 <i className="fa-solid fa-circle-info text-base text-blue-600"></i>
                                 <span className="text-[10px] font-black uppercase text-slate-400">Tactical Insight</span>
                              </div>
                              <p className="text-xs font-bold text-slate-500 leading-relaxed uppercase">
                                {day.details}
                              </p>
                            </div>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* ITINERARY TAB */}
              {activeTab === 'itinerary' && (

                    <table className="w-full text-left border-collapse">
                      <thead>
                        <tr className="bg-slate-900 text-white text-xs uppercase tracking-widest font-black">

                          <th className="px-6 py-4">Objective</th>
                          <th className="px-6 py-4">Daily Deep Dive</th>
                          <th className="px-6 py-4 text-center">Alt</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {itinerary.map((day, idx) => (
                          <tr key={idx} className="group hover:bg-blue-50/40 transition-colors">
                            <td className="px-6 py-6 align-top">
                              <div className="text-xs font-black text-slate-400 uppercase mb-1">{day.date}</div>
                              <div className="flex items-center gap-2 text-blue-600">
                                {day.icon}

                              </div>
                            </td>
                            <td className="px-6 py-6 align-top">
                              <h3 className="font-black text-slate-900 leading-tight mb-2">{day.plan}</h3>
                              <span className="text-[10px] px-2 py-1 bg-slate-100 rounded text-slate-500 font-bold uppercase">
                                {day.activity}
                              </span>
                            </td>
                            <td className="px-6 py-6 align-top">
                              <p className="text-sm text-slate-600 leading-relaxed font-medium">
                                {day.details}
                              </p>
                            </td>
                            <td className="px-6 py-6 align-top text-center">
                              <div className="flex flex-col items-center">
                                <i className={`fa-solid fa-circle-arrow-up text-base mb-1 ${idx > 0 && parseInt(itinerary[idx].alt.replace(',','')) > parseInt(itinerary[idx-1].alt.replace(',','')) ? 'text-rose-500' : 'text-emerald-500'}`}></i>
                                <span className="text-lg font-black text-slate-900 whitespace-nowrap">{day.alt}</span>
                              </div>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* BUDGET TAB */}
              {activeTab === 'budget' && (

                    <div className="p-8 bg-slate-900 text-white">
                      <h2 className="text-2xl font-black uppercase">Budget Breakdown</h2>
                      <p className="text-slate-400 text-sm font-medium italic">Estimated per person (Shane, Poon, Bew)</p>
                    </div>
                    <div className="p-0">
                      <table className="w-full text-left">
                        <thead>
                          <tr className="text-[10px] uppercase font-black text-slate-400 border-b border-slate-100">
                            <th className="px-8 py-5">Item Details</th>
                            <th className="px-8 py-5 text-right">USD</th>
                            <th className="px-8 py-5 text-right">THB (x33)</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                          {budgetItems.map((b, i) => (
                            <tr key={i} className="hover:bg-slate-50 transition-colors">
                              <td className="px-8 py-4">
                                <p className="text-sm font-bold text-slate-700">{b.item}</p>
                                <p className="text-[10px] text-slate-400 uppercase font-black">{b.note}</p>
                              </td>
                              <td className="px-8 py-4 text-sm text-right font-black text-slate-900">${b.usd.toFixed(2)}</td>
                              <td className="px-8 py-4 text-sm text-right font-mono text-slate-500">{(b.usd * rate).toLocaleString()}</td>
                            </tr>
                          ))}
                        </tbody>
                        <tfoot>
                          <tr className="bg-slate-900 text-white">
                            <td className="px-8 py-6 font-black uppercase tracking-widest">Total Trip Cost</td>
                            <td className="px-8 py-6 text-right font-black text-2xl">${totalUSD.toFixed(2)}</td>
                            <td className="px-8 py-6 text-right font-black text-2xl">{(totalUSD * rate).toLocaleString()}</td>
                          </tr>
                        </tfoot>
                      </table>
                    </div>
                  </div>
                  <div className="space-y-6">
                    <div className="bg-emerald-600 rounded-3xl p-8 text-white shadow-xl relative overflow-hidden">
                      <div className="absolute right-[10px] top-[10px] opacity-10">
                        <i className="fa-solid fa-sack-dollar text-[6rem]"></i>
                      </div>
                      <h3 className="text-xl font-black uppercase mb-2 flex items-center gap-2 text-white">
                        Status: Deposit
                      </h3>
                      <p className="text-sm font-bold opacity-90 mb-4 text-emerald-100">Paid to Agency</p>
                      <p className="text-4xl font-black text-white">${depositUSD.toFixed(0)} <span className="text-lg font-bold">USD</span></p>
                      <p className="text-xs font-bold mt-1 opacity-75 text-emerald-100">~{(depositUSD * rate).toLocaleString()} THB / person</p>
                    </div>

                    <div className="bg-slate-900 rounded-3xl p-8 text-white shadow-2xl border border-slate-800">
                      <h3 className="text-xl font-black uppercase mb-6 flex items-center gap-2 text-blue-500">
                        <i className="fa-solid fa-receipt text-xl"></i> Arrival Strategy
                      </h3>
                      <div className="space-y-4">
                        <div className="flex gap-3">
                          <div className="w-5 h-5 rounded bg-blue-600 flex items-center justify-center shrink-0 font-black text-[10px] text-white">1</div>
                          <p className="text-xs font-bold text-slate-300">Get <strong>USD</strong> from Thailand before flying.</p>
                        </div>
                        <div className="flex gap-3">
                          <div className="w-5 h-5 rounded bg-blue-600 flex items-center justify-center shrink-0 font-black text-[10px] text-white">2</div>
                          <p className="text-xs font-bold text-slate-300">Airport: Exchange <strong>only enough</strong> (~70-80 THB) for taxi to town.</p>
                        </div>
                        <div className="flex gap-3">
                          <div className="w-5 h-5 rounded bg-blue-600 flex items-center justify-center shrink-0 font-black text-[10px] text-white">3</div>
                          <p className="text-xs font-bold text-slate-300">Use <strong>"InDrive"</strong> app (Nepal Uber). Pay cash only.</p>
                        </div>
                        <div className="flex gap-3">
                          <div className="w-5 h-5 rounded bg-blue-600 flex items-center justify-center shrink-0 font-black text-[10px] text-white">4</div>
                          <p className="text-xs font-bold text-slate-300 font-black text-white uppercase">Manaslu Exchange:</p>
                        </div>
                        <div className="ml-8 border-l-2 border-slate-700 pl-4 space-y-2">
                          <p className="text-[10px] text-slate-400 leading-relaxed font-bold italic">Near <strong>Hotel Dreams Connect</strong>. Tell the owner you're a <strong>Friend of Sakuna</strong> for a special rate.</p>
                          <p className="text-[10px] text-amber-500 font-black uppercase">Exchange before 6 APR.</p>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* MISSION PREP TAB */}
              {activeTab === 'prep' && (
                <div className="space-y-8">
                  <div className="grid md:grid-cols-2 gap-8">
                    {/* Checklist Categories */}
                    <div className="space-y-6">
                      {gearChecklist.map((cat, i) => (
                        <div key={i} className="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                          <div className="p-6 border-b border-slate-50 bg-slate-50/50 flex items-center gap-3">
                            <span className="p-2 bg-blue-100 text-blue-600 rounded-xl">
                              {cat.icon}
                            </span>
                            <h3 className="font-black uppercase text-slate-900 tracking-tight">{cat.category}</h3>
                          </div>
                          <div className="p-4 space-y-2">
                            {cat.items.map((item, j) => (
                              <label key={j} className="flex items-center gap-4 p-3 rounded-2xl hover:bg-slate-50 transition-all cursor-pointer group">
                                <input 
                                  type="checkbox" 
                                  className="w-5 h-5 rounded-md border-slate-300 text-blue-600 focus:ring-blue-500"
                                  onChange={() => toggleCheck(`${i}-${j}`)}
                                />
                                <div className="flex-1">
                                  <div className="flex items-center gap-2">
                                    <span className="font-bold text-slate-700 text-sm group-hover:text-blue-600 transition-colors">
                                      {item.icon && <span className="mr-2 inline-block">{item.icon}</span>}
                                      {item.name}
                                    </span>
                                    <span className={`text-[9px] px-1.5 py-0.5 rounded font-black uppercase tracking-tighter ${
                                      item.status === 'Must-have' ? 'bg-rose-100 text-rose-600' : 'bg-slate-100 text-slate-400'
                                    }`}>
                                      {item.status}
                                    </span>
                                  </div>
                                  <p className="text-[10px] text-slate-400 font-bold uppercase">{item.note}</p>
                                </div>
                              </label>
                            ))}
                          </div>
                        </div>
                      ))}
                    </div>

                    {/* Side Notes & Tips */}
                    <div className="space-y-8 h-fit sticky top-8">
                      <div className="bg-blue-600 rounded-3xl p-10 text-white shadow-xl relative overflow-hidden">
                        <div className="absolute right-[-20px] bottom-[-20px] opacity-10">
                          <i className="fa-solid fa-shield-halved text-[8rem]"></i>
                        </div>
                        <h3 className="text-xl font-black uppercase mb-6">Mission Critical Summary</h3>
                        <div className="space-y-4 text-sm font-bold opacity-90">
                          <p className="flex items-center gap-2">
                            <i className="fa-solid fa-circle-check text-base text-blue-300"></i> Documents: Passport & High-alt Insurance
                          </p>
                          <p className="flex items-center gap-2">
                            <i className="fa-solid fa-circle-check text-base text-blue-300"></i> Clothing: Warm layers (Home/Rent)
                          </p>
                          <p className="flex items-center gap-2">
                            <i className="fa-solid fa-circle-check text-base text-blue-300"></i> Tech: Power bank (Lion Air Approved)
                          </p>
                        </div>
                      </div>

                      <div className="bg-amber-50 border border-amber-100 rounded-3xl p-8 shadow-sm">
                        <h3 className="text-amber-800 font-black uppercase mb-4 flex items-center gap-2">
                          <i className="fa-solid fa-bolt text-xl"></i> Tech & Power Specs
                        </h3>
                        <ul className="space-y-4 text-[11px] font-bold text-amber-900/70 leading-relaxed">
                          <li className="flex gap-3">
                            <div className="w-2 h-2 rounded-full bg-blue-400 mt-1 shrink-0"></div>
                            <span><strong>Power Bank:</strong> Thai Lion Air Allows max 32,000 mAh (160Wh). **MUST** be in carry-on. A 20,000 mAh unit is safe.</span>
                          </li>
                          <li className="flex gap-3">
                            <div className="w-2 h-2 rounded-full bg-blue-400 mt-1 shrink-0"></div>
                            <span><strong>Plugs:</strong> Nepal uses Type C/D/M. Most Teahouses fit Thai round pins. Universal Adapter is recommended.</span>
                          </li>
                        </ul>
                      </div>

                      <div className="bg-slate-900 rounded-3xl p-8 text-white shadow-sm border border-slate-800">
                        <h3 className="text-sm font-black uppercase mb-4 text-blue-500">Altitude Safety (AMS)</h3>
                        <p className="text-xs font-medium text-slate-400 leading-relaxed">
                          Take <strong>Diamox</strong> if advised. If symptoms persist after medication, we descend immediately. No exceptions.
                        </p>
                      </div>
                    </div>
                  </div>
                </div>
              )}

            </div>
          </div>
          
          <footer className="mt-20 py-12 text-center border-t border-slate-200">
            <p className="text-slate-400 text-[10px] font-black uppercase tracking-[0.3em] mb-4">
              The Roof of the World Awaits
            </p>
            <div className="flex justify-center gap-6 opacity-40">
               <span className="text-xs font-black uppercase tracking-widest text-slate-400">Shane</span>
               <span className="text-xs font-black uppercase tracking-widest text-slate-400">Poon</span>
               <span className="text-xs font-black uppercase tracking-widest text-slate-400">Bew</span>
            </div>
          </footer>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
